[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-xray-classifier"
version = "0.1.0"
description = "COVID-19 chest X-ray binary classification pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tensorboard>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]
